# Base cosmology shared by every run: fiducial values and priors.
# Parameters with a `prior` are sampled in the grid; in the notebooks they are fixed
# to their fiducial value (ref.loc) unless listed in `sample`.
#
# Neutrinos: normal hierarchy at its minimal mass sum; how camb splits the sum
# between eigenstates is set in theory/camb.yaml.
params:
  H0:
    prior: {min: 40, max: 100}
    ref: {dist: norm, loc: 67.7, scale: 0.1}
    latex: 'H_0'
  logA:
    drop: true
    prior: {min: 1.6, max: 4.0}
    ref: {dist: norm, loc: 3.05, scale: 0.001}
    latex: '\log(10^{10} A_\mathrm{s})'
  As:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: 'A_\mathrm{s}'
  ombh2:
    prior: {min: 0.022, max: 0.023}
    ref: {dist: norm, loc: 0.0224, scale: 0.0001}
    latex: '\Omega_\mathrm{b} h^2'
  omch2:
    prior: {min: 0.09, max: 0.15}
    ref: {dist: norm, loc: 0.1202, scale: 0.001}
    latex: '\Omega_c h^2'
  ns:
    prior: {min: 0.9, max: 1.1}
    ref: {dist: norm, loc: 0.9649, scale: 0.001}
    latex: 'n_s'
  tau:
    prior: {dist: norm, loc: 0.0544, scale: 0.0073}
    ref: {dist: norm, loc: 0.0544, scale: 0.0073}
    proposal: 0.0073
    latex: '\tau_\mathrm{reio}'
  Alens:
    value: 1.0
    latex: 'A_\mathrm{lens}'
  # Minimal normal-hierarchy sum: 0 + sqrt(7.5e-5) + sqrt(2.5e-3) eV.
  mnu:
    value: 0.0586602540378444
    latex: '\sum m_\nu'
  nnu:
    value: 3.044
    latex: 'N_\mathrm{eff}'
  omega_de: {derived: true, latex: '\Omega_\Lambda'}
  omegam: {derived: true, latex: '\Omega_\mathrm{m}'}
  omegamh2:
    derived: 'lambda omegam, H0: omegam*(H0/100)**2'
    latex: '\Omega_\mathrm{m} h^2'
  sigma8: {derived: true, latex: '\sigma_8'}
