# What the ISO analysis is made of. Read by iso_config.py; generate_grid.ipynb turns
# it into the cobaya-grid yaml.

# Boltzmann code: camb or classy (picks theory/<code>.yaml and probes/*/<code>.yaml).
theory: camb

# Model name -> files of models/ merged on top of the base. lcdm adds nothing.
models:
  lcdm: []
  mnu: [mnu]
  neff: [neff]
  mnu_neff: [mnu, neff]

# Dataset name -> probes (folders of probes/). Several probes are combined in one
# MultiGaussianLikelihood; `cross_cov` (a key of paths.yaml) adds their
# cross-covariance.
datasets:
  mflike:
    probes: [mflike]
  lensing:
    probes: [lensing]
  multigaussian_mflike_lensing:
    probes: [mflike, lensing]
    cross_cov: cross_cov
  galaxy_kappa:
    probes: [galaxy_kappa]

# Grid groups: which models are run on which datasets.
groups:
  lcdm:
    models: [lcdm]
    datasets: [mflike, lensing, multigaussian_mflike_lensing, galaxy_kappa]
  extended:
    models: [mnu, neff, mnu_neff]
    datasets: [mflike, lensing, multigaussian_mflike_lensing, galaxy_kappa]
