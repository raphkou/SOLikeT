# Massive neutrinos: the mass sum becomes a free parameter (flat prior).
# Replaces the fixed normal-hierarchy sum of cosmo.yaml; camb splits each sampled
# sum as set in theory/camb.yaml. Below the minimal normal-hierarchy sum
# (~0.059 eV) camb does not fail: it puts the whole sum on one massive neutrino.
params:
  mnu:
    prior: {min: 0.0, max: 5.0}
    ref: {min: 0.0, max: 0.1}
    proposal: 0.01
    latex: '\sum m_\nu'
