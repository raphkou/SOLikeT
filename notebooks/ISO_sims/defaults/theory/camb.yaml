# camb setup shared by every run: camb's built-in normal hierarchy.
# camb splits the sum `mnu` (cosmo.yaml) with its own mass splittings, using two
# eigenstates (the two lighter neutrinos degenerate). Below mnu ~ 0.060 eV, which
# includes the fiducial minimal sum, it uses a single massive neutrino carrying the
# whole sum. N_eff follows `nnu`.
# Precision settings a probe needs are in probes/<probe>/camb.yaml.
theory:
  camb:
    extra_args:
      neutrino_hierarchy: normal
      num_massive_neutrinos: 3
